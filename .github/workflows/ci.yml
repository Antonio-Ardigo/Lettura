name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint & test dependencies
        # The ML/TTS stack (torch, kokoro) is intentionally not installed here:
        # lint and the unit tests don't need it, keeping CI fast and reliable.
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pdfplumber

      - name: Ruff (lint)
        run: ruff check backend/ tests/

      - name: Pytest (unit tests)
        run: pytest -q

      - name: Shell syntax check (SessionStart hook)
        run: bash -n .claude/hooks/session-start.sh
